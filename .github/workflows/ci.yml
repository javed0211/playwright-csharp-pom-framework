name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Test
        run: dotnet test tests/PlaywrightPom.Core.Tests/PlaywrightPom.Core.Tests.csproj -c Release --settings runsettings/ci.runsettings --logger "trx;LogFileName=unit.trx" --collect:"XPlat Code Coverage"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-results
          path: |
            artifacts
            tests/PlaywrightPom.Core.Tests/TestResults
          if-no-files-found: ignore

  api:
    name: API
    runs-on: ubuntu-latest
    env:
      NEXUS_ENVIRONMENT: CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Test
        run: dotnet test tests/PlaywrightPom.Api.Tests/PlaywrightPom.Api.Tests.csproj -c Release --settings runsettings/ci.runsettings --logger "trx;LogFileName=api.trx"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-results
          path: artifacts
          if-no-files-found: ignore

  web:
    name: Web
    runs-on: ubuntu-latest
    env:
      NEXUS_ENVIRONMENT: CI
      BROWSER: chromium
      HEADED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build
        run: dotnet build tests/PlaywrightPom.Web.Tests/PlaywrightPom.Web.Tests.csproj -c Release
      - name: Install Chromium
        run: |
          out="$(find tests/PlaywrightPom.Web.Tests/bin/Release -type d -name net9.0 | head -n 1)"
          nodebin="$(find "$out/.playwright/node" -type f -name node | head -n 1)"
          "$nodebin" "$out/.playwright/package/cli.js" install --with-deps chromium
      - name: Test
        run: dotnet test tests/PlaywrightPom.Web.Tests/PlaywrightPom.Web.Tests.csproj -c Release --no-build --settings runsettings/ci.runsettings --logger "trx;LogFileName=web.trx"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-results
          path: artifacts
          if-no-files-found: ignore
