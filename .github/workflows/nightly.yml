name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  browsers:
    name: Web (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      NEXUS_ENVIRONMENT: CI
      BROWSER: ${{ matrix.browser }}
      HEADED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build
        run: dotnet build tests/PlaywrightPom.Web.Tests/PlaywrightPom.Web.Tests.csproj -c Release
      - name: Install browser
        run: |
          out="$(find tests/PlaywrightPom.Web.Tests/bin/Release -type d -name net9.0 | head -n 1)"
          nodebin="$(find "$out/.playwright/node" -type f -name node | head -n 1)"
          "$nodebin" "$out/.playwright/package/cli.js" install --with-deps "${{ matrix.browser }}"
      - name: Test
        run: dotnet test tests/PlaywrightPom.Web.Tests/PlaywrightPom.Web.Tests.csproj -c Release --no-build --settings runsettings/ci.runsettings --logger "trx;LogFileName=web-${{ matrix.browser }}.trx"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.browser }}
          path: artifacts
          if-no-files-found: ignore

  api-contracts:
    name: API contracts
    runs-on: ubuntu-latest
    env:
      NEXUS_ENVIRONMENT: CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Test
        run: dotnet test tests/PlaywrightPom.Api.Tests/PlaywrightPom.Api.Tests.csproj -c Release --settings runsettings/ci.runsettings --filter "TestCategory=Contract" --logger "trx;LogFileName=contracts.trx"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-contracts
          path: artifacts
          if-no-files-found: ignore
